<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>
        // HTMLの解析が始まった瞬間に、最速で画面を切り替える
        window.location.replace("generator.html");
    </script>
    <!-- 0秒後にcontentへ移動する設定 -->
    <meta http-equiv="refresh" content="0;URL=generator.html">
</head>
<body>
    <p>自動的に移動します。移動しない場合は<a href="generator.html">こちら</a>をクリックしてください。</p>
</body>
</html>
